services:
  db:
    image: postgres:17-alpine
    container_name: lebonmedoc-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-lebonmedoc}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-lebonmedoc}
      POSTGRES_DB: ${DB_NAME:-lebonmedoc}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Scripts exécutés uniquement à la première création du volume
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
